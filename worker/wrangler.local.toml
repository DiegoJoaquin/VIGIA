# Configuración para probar en tu computador (base local, correos en consola, sin IA).
# Un solo Worker sirve la app (archivos estáticos), la API, el calendario .ics y las alertas diarias.
name = "vigia"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = false

[[d1_databases]]
binding = "DB"
database_name = "vigia"
database_id = "local-test"

# Workers AI (gratis hasta 10.000 "neuronas" al día) para leer RCA desde la app.
# Si prefieres usar tu propio servidor con Ollama, borra este bloque y usa extractor/extract_rca.py.

# Alertas: todos los días a las 11:00 UTC (8:00 en Chile en horario de verano, 7:00 en invierno).
[triggers]
crons = ["0 11 * * *"]

[vars]
APP_URL = "http://127.0.0.1:8787"
APP_NAME = "Vigía"
# brevo | resend | gas (Google Apps Script) | log (solo imprime en consola)
MAIL_PROVIDER = "log"
MAIL_FROM = "avisos@tudominio.cl"
MAIL_FROM_NAME = "Vigía"

# Secretos (no van aquí; se cargan con `npx wrangler secret put NOMBRE`):
#   BREVO_API_KEY  o  RESEND_API_KEY  o  GAS_URL + GAS_TOKEN
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT   (notificaciones en el celular)
#   EXTRACTOR_TOKEN                                       (para que tu servidor suba RCA leídas con Ollama)

EXTRACTOR_TOKEN = "test-token"
