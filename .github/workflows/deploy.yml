# Publica Vigía en Cloudflare cada vez que cambia main (o a mano desde la pestaña Actions).
# Necesita dos secretos del repositorio: CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID.
name: Publicar Vigía
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      # Primera vez: crea las llaves de las notificaciones del celular y las guarda como secretos de Cloudflare.
      # Las llaves nunca salen de aquí ni se muestran; si ya existen, no se tocan.
      - name: Activar notificaciones en el celular
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx wrangler secret list 2>/dev/null | grep -q VAPID_PRIVATE_KEY; then
            echo "Las notificaciones ya estaban activadas."
          else
            node -e "const c=require('crypto');const j=c.generateKeyPairSync('ec',{namedCurve:'prime256v1'}).privateKey.export({format:'jwk'});const b=(x)=>Buffer.from(x,'base64url');require('fs').writeFileSync('.vapid-pub',Buffer.concat([Buffer.from([4]),b(j.x),b(j.y)]).toString('base64url'));require('fs').writeFileSync('.vapid-priv',j.d)"
            npx wrangler secret put VAPID_PUBLIC_KEY < .vapid-pub
            npx wrangler secret put VAPID_PRIVATE_KEY < .vapid-priv
            echo -n "mailto:diazdiego011@gmail.com" | npx wrangler secret put VAPID_SUBJECT
            rm -f .vapid-pub .vapid-priv
            echo "Notificaciones activadas."
          fi
      # Correos: si en GitHub (Settings > Secrets) existen GAS_URL y GAS_TOKEN, se copian a Cloudflare.
      - name: Activar envío de correos
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GAS_URL: ${{ secrets.GAS_URL }}
          GAS_TOKEN: ${{ secrets.GAS_TOKEN }}
        run: |
          if npx wrangler secret list 2>/dev/null | grep -q GAS_URL && npx wrangler secret list 2>/dev/null | grep -q GAS_TOKEN; then
            echo "El envío de correos ya estaba activado."
          elif [ -n "$GAS_URL" ] && [ -n "$GAS_TOKEN" ]; then
            printf '%s' "$GAS_URL" | npx wrangler secret put GAS_URL
            printf '%s' "$GAS_TOKEN" | npx wrangler secret put GAS_TOKEN
            echo "Correos activados."
          else
            echo "Faltan los secretos GAS_URL y GAS_TOKEN en GitHub; correos sin cambios."
          fi
      - run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
