name: SEIA titulares
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/seia/titulares.mjs ../out
      - run: |
          cd ../out && git init -q -b seia-titulares && git config user.name vigia && git config user.email vigia@users.noreply.github.com
          git add -A && git commit -qm probe && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" seia-titulares
