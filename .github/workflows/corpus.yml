# Descarga RCA públicas del SEIA y guarda su texto, para medir y mejorar la lectura de compromisos.
# Se ejecuta a mano desde la pestaña Actions (no corre en cada push).
name: Corpus de RCA
on:
  workflow_dispatch:
jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --workspace worker --include-workspace-root=false --ignore-scripts
      - run: node tests/corpus/fetch.mjs corpus-out
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-rca
          path: corpus-out
          retention-days: 7
